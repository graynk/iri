name: Publish release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  tarball:
    name: Publish release tarball
    runs-on: ubuntu-latest

    # Uploading an asset to the release needs write access to repository contents.
    permissions:
      contents: write

    env:
      MIX_ENV: prod
      # Keep these in step with the Dockerfile's build stage.
      ELIXIR_VERSION: "1.20.2"
      OTP_VERSION: "29.0.3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Fetch and compile dependencies
        run: |
          mix deps.get --only "$MIX_ENV"
          mix deps.compile

      - name: Build assets
        run: mix assets.deploy

      - name: Build release
        run: mix release

      - name: Package release
        run: |
          archive="iri-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz"
          tar -czf "$archive" -C _build/prod/rel/iri .
          sha256sum "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$ARCHIVE" "$ARCHIVE.sha256" --clobber
